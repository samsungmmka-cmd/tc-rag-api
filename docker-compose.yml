services:
  api:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      retries: 5
    restart: unless-stopped

# Join the infra stack's network so "redis" / "qdrant" resolve by name.
networks:
  default:
    name: ocr-infra
    external: true
